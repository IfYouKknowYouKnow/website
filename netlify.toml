[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/l/*"
  to = "https://nsgrmfhjkabjipcxtmvc.functions.supabase.co/l/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/team"
  to = "/about"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/tutorials"
  to = "/tutorials.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Netlify normalizes trailing slashes before matching redirects. Let it serve
# the generated city/index.html files directly; slash-only redirects can loop.

[[redirects]]
  from = "/invite/*"
  to = "/invite/index.html"
  status = 200

[[redirects]]
  from = "/place/*"
  to = "/place/index.html"
  status = 200

[[redirects]]
  from = "/list/*"
  to = "/list/index.html"
  status = 200

[[redirects]]
  from = "/community/*"
  to = "/community/index.html"
  status = 200

# Unknown URLs must return 404, rather than a successful copy of the homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_MAPBOX_TOKEN"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/invite/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/place/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/community/*"
  [headers.values]
    X-Robots-Tag = "noindex"
