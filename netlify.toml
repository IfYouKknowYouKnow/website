[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/l/*"
  to = "https://nsgrmfhjkabjipcxtmvc.functions.supabase.co/l/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/zurich"
  to = "/zurich/index.html"
  status = 200

[[redirects]]
  from = "/zurich/*"
  to = "/zurich/:splat/index.html"
  status = 200

[[redirects]]
  from = "/geneva"
  to = "/geneva/index.html"
  status = 200

[[redirects]]
  from = "/berlin"
  to = "/berlin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_MAPBOX_TOKEN"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
