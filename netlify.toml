[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/l/*"
  to = "https://nsgrmfhjkabjipcxtmvc.functions.supabase.co/l/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/team"
  to = "/about#team"
  status = 301

# English is served from the root. /en is only an alias people may type.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Download and city guide index pages, in every language.
[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 200

[[redirects]]
  from = "/cities"
  to = "/cities.html"
  status = 200

[[redirects]]
  from = "/de/download"
  to = "/de/download.html"
  status = 200

[[redirects]]
  from = "/de/cities"
  to = "/de/cities.html"
  status = 200

[[redirects]]
  from = "/fr/download"
  to = "/fr/download.html"
  status = 200

[[redirects]]
  from = "/fr/cities"
  to = "/fr/cities.html"
  status = 200

[[redirects]]
  from = "/it/download"
  to = "/it/download.html"
  status = 200

[[redirects]]
  from = "/it/cities"
  to = "/it/cities.html"
  status = 200

# German, French and Italian pages live under /de, /fr and /it with the same paths.
[[redirects]]
  from = "/de/about"
  to = "/de/about.html"
  status = 200

[[redirects]]
  from = "/de/tutorials"
  to = "/de/tutorials.html"
  status = 200

[[redirects]]
  from = "/fr/about"
  to = "/fr/about.html"
  status = 200

[[redirects]]
  from = "/fr/tutorials"
  to = "/fr/tutorials.html"
  status = 200

[[redirects]]
  from = "/it/about"
  to = "/it/about.html"
  status = 200

[[redirects]]
  from = "/it/tutorials"
  to = "/it/tutorials.html"
  status = 200

[[redirects]]
  from = "/tutorials"
  to = "/tutorials.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Netlify normalizes trailing slashes before matching redirects. Let it serve
# the generated city/index.html files directly; slash-only redirects can loop.

[[redirects]]
  from = "/invite/*"
  to = "/invite/index.html"
  status = 200

[[redirects]]
  from = "/place/*"
  to = "/place/index.html"
  status = 200

[[redirects]]
  from = "/list/*"
  to = "/list/index.html"
  status = 200

[[redirects]]
  from = "/community/*"
  to = "/community/index.html"
  status = 200

# Unknown URLs inside a language get that language's "not found" page.
[[redirects]]
  from = "/de/*"
  to = "/de/404.html"
  status = 404

[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404

[[redirects]]
  from = "/it/*"
  to = "/it/404.html"
  status = 404

# Unknown URLs must return 404, rather than a successful copy of the homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_MAPBOX_TOKEN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/invite/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/place/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/community/*"
  [headers.values]
    X-Robots-Tag = "noindex"
