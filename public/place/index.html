<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open In YK</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f0e8;
        --ink: #111111;
        --muted: rgba(17, 17, 17, 0.72);
        --panel: rgba(255, 255, 255, 0.84);
        --border: rgba(17, 17, 17, 0.08);
        --shadow: 0 22px 50px rgba(17, 17, 17, 0.12);
        --primary: #111111;
        --primary-ink: #f6f0e8;
        --secondary: rgba(17, 17, 17, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Georgia", "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 38%),
          radial-gradient(circle at bottom right, rgba(17, 17, 17, 0.08), transparent 28%),
          linear-gradient(160deg, #efe3d2 0%, var(--bg) 58%, #efe9e1 100%);
        color: var(--ink);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 560px);
        padding: 32px 28px;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 3.3rem);
        line-height: 0.95;
      }

      .subtitle {
        margin: 16px 0 0;
        font-size: 1rem;
        line-height: 1.55;
        color: var(--muted);
      }

      .status {
        margin-top: 22px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(17, 17, 17, 0.05);
        font-size: 0.98rem;
        line-height: 1.45;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        border: 1px solid transparent;
        font-size: 0.98rem;
        font-weight: 700;
      }

      .buttonPrimary {
        background: var(--primary);
        color: var(--primary-ink);
      }

      .buttonSecondary {
        border-color: var(--border);
        background: var(--secondary);
        color: var(--ink);
      }

      .footnote {
        margin: 18px 0 0;
        font-size: 0.86rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <p class="eyebrow">YK Place Share</p>
        <h1 id="headline">Opening in the app…</h1>
        <p class="subtitle" id="subtitle">
          If YK is installed, this place should open automatically.
        </p>

        <div class="status" id="status">
          Trying to open the shared place now.
        </div>

        <div class="actions hidden" id="actions">
          <a class="button buttonPrimary" id="openButton" href="/">Open in YK</a>
          <a
            class="button buttonSecondary"
            href="https://apps.apple.com/us/app/yk-youknow/id6759484614"
            id="storeButton"
            rel="noreferrer"
            target="_blank"
          >
            Download the app
          </a>
          <a
            class="button buttonSecondary"
            href="https://github.com/IfYouKknowYouKnow/website/releases/latest/download/app-release.apk"
            id="androidButton"
            rel="noreferrer"
            target="_blank"
          >
            Download Android APK
          </a>
        </div>

        <p class="footnote hidden" id="footnote">
          If you install the app now, come back to this link and tap “Open in YK”.
        </p>
      </section>
    </main>

    <script>
      (function () {
        const APP_STORE_URL = 'https://apps.apple.com/us/app/yk-youknow/id6759484614'
        const ANDROID_DOWNLOAD_URL =
          'https://github.com/IfYouKknowYouKnow/website/releases/latest/download/app-release.apk'

        const params = new URLSearchParams(window.location.search)
        const placeId = (params.get('id') || '').trim()

        const headline = document.getElementById('headline')
        const subtitle = document.getElementById('subtitle')
        const status = document.getElementById('status')
        const actions = document.getElementById('actions')
        const footnote = document.getElementById('footnote')
        const openButton = document.getElementById('openButton')
        const storeButton = document.getElementById('storeButton')
        const androidButton = document.getElementById('androidButton')

        const ua = navigator.userAgent || ''
        const isAndroid = /Android/i.test(ua)
        const isIOS = /iPhone|iPad|iPod/i.test(ua)
        const appUrl = placeId ? `iykyk://place/${encodeURIComponent(placeId)}` : 'iykyk://'

        if (isAndroid) {
          storeButton.href = ANDROID_DOWNLOAD_URL
          storeButton.textContent = 'Download Android APK'
          androidButton.classList.add('hidden')
        } else {
          storeButton.href = APP_STORE_URL
          androidButton.classList.remove('hidden')
        }

        openButton.href = appUrl

        if (!placeId) {
          headline.textContent = 'This place link is incomplete'
          subtitle.textContent =
            'Ask your friend to share the place again so we can open it correctly.'
          status.textContent = 'We could not find a place ID in this link.'
          actions.classList.remove('hidden')
          footnote.classList.add('hidden')
          return
        }

        const revealFallback = () => {
          headline.textContent = 'Open this place in YK'
          subtitle.textContent =
            'If the app did not open automatically, use the button below or install it first.'
          status.textContent =
            'We tried opening the shared place. If you do not have YK yet, download it here.'
          actions.classList.remove('hidden')
          footnote.classList.remove('hidden')
        }

        const fallbackTimer = window.setTimeout(revealFallback, 1600)

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            window.clearTimeout(fallbackTimer)
          }
        })

        if (isIOS || isAndroid) {
          window.setTimeout(() => {
            window.location.replace(appUrl)
          }, 120)
        } else {
          revealFallback()
        }
      })()
    </script>
  </body>
</html>
