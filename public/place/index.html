<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf6">
  <meta name="description" content="Open a shared place in YouKnow.">
  <meta property="og:title" content="Open this place in YouKnow">
  <meta property="og:description" content="See the place your friend shared with you.">
  <meta property="og:image" content="/images/map_10.png">
  <title>Open place | YouKnow</title>
  <link rel="icon" type="image/png" href="/youknow-favicon.png">
  <link rel="apple-touch-icon" href="/icons/youknow-icon-192.png">
  <link rel="stylesheet" href="/shared-link.css">
</head>
<body>
  <main class="page">
    <section class="content">
      <img class="logo brand-logo" src="/images/youknow-wordmark.png" alt="YouKnow">
      <p class="eyebrow">📍 Shared place</p>
      <h1>Open this place in YouKnow.</h1>
      <p class="lead">
        Your friend sent you a spot from their map. Open it in the app to see the details, vibes, and who saved it.
      </p>
      <div class="actions">
        <a class="button" id="open-app" href="#">Open in app</a>
        <a class="button secondary" id="get-app" href="https://apps.apple.com/us/app/yk-youknow/id6759484614">Get the app</a>
      </div>
      <p class="status" id="status">Trying to open YouKnow…</p>
    </section>

    <section class="hero" aria-hidden="true">
      <div class="phone back">
        <img src="/images/map_7.png" alt="">
      </div>
      <div class="phone">
        <img src="/images/place_7.png" alt="">
      </div>
      <div class="floating-card">
        <p class="title">Places, not lists.</p>
        <p class="text">Jump straight to the shared pin and keep exploring from there.</p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var segments = window.location.pathname.split('/').filter(Boolean);
      var placeId = (params.get('id') || segments[1] || '').trim();
      var openButton = document.getElementById('open-app');
      var getAppButton = document.getElementById('get-app');
      var status = document.getElementById('status');

      if (!placeId) {
        status.textContent = 'This place link is missing its place id.';
        openButton.setAttribute('href', '/');
        return;
      }

      var encodedPlaceId = encodeURIComponent(placeId);
      var appStoreUrl = 'https://apps.apple.com/us/app/yk-youknow/id6759484614';
      var deepLink = 'youknow://place/' + encodedPlaceId;
      var userAgent = window.navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(userAgent) ||
        (window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);

      if (isIOS) {
        openButton.textContent = 'Get the app';
        openButton.setAttribute('href', appStoreUrl);
        getAppButton.style.display = 'none';
        status.textContent = 'Install YouKnow to open shared places from friends.';
        return;
      }

      openButton.setAttribute('href', deepLink);
      window.setTimeout(function () {
        window.location.href = deepLink;
      }, 450);

      window.setTimeout(function () {
        status.textContent = 'If the app did not open, use the button above or install YouKnow.';
      }, 1600);
    })();
  </script>
</body>
</html>
